<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>球員模型檢視</title>
    <style>
      :root { --ink: #f4efe4; --dim: rgba(244, 239, 228, 0.62); --accent: #d8ff3e; --panel: rgba(12, 18, 22, 0.86); --line: rgba(255, 255, 255, 0.12);
        --tc: 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #b9bcc4; font-family: var(--tc); color: var(--ink); }
      #stage { position: fixed; inset: 0; }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .bar { position: fixed; left: 16px; top: 16px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 12px 14px; }
      .bar h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: 0.08em; }
      .bar p { margin: 0 0 10px; font-size: 12px; color: var(--dim); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .row span { font-size: 12px; color: var(--dim); align-self: center; min-width: 3em; }
      button, select { cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); color: var(--ink); border-radius: 6px;
        padding: 6px 10px; font: 500 13px var(--tc); }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.35; cursor: default; }
      button.on { background: var(--accent); color: #10161b; border-color: var(--accent); }
      .info { position: fixed; left: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px 12px; font-size: 12px; color: var(--dim); line-height: 1.7; }
      .info b { color: var(--ink); font-weight: 600; }
      #err { color: #ff8a70; }
      #more { display: none; float: right; margin-left: 10px; }
      /* 窄畫面：控制列在上、模型在下，避免面板蓋住模型 */
      @media (max-width: 760px) {
        body { display: flex; flex-direction: column; }
        .bar { position: static; margin: 8px 8px 0; max-width: none; padding: 8px 10px; flex: none; }
        .bar h1 { font-size: 13px; margin: 0; line-height: 24px; }
        #more { display: inline-block; }
        .bar:not(.open) .row { display: none; }
        .info div:not(:nth-child(2)) { display: none; }
        .bar p { display: none; }
        .row { gap: 4px; margin-top: 5px; }
        .row span { font-size: 11px; min-width: 2.4em; }
        button, select { padding: 4px 7px; font-size: 11px; }
        #stage { position: relative; inset: auto; flex: 1; min-height: 0; order: 2; }
        .bar { order: 1; }
        .info { order: 3; }
        .info { position: static; margin: 0 8px 8px; padding: 6px 10px; font-size: 10px; line-height: 1.5; flex: none; }
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <div class="bar">
      <h1>球員模型檢視<button id="more" type="button">選項</button></h1>
      <p>拖曳旋轉・滾輪縮放・右鍵拖曳平移。這一頁只用來看模型，不影響遊戲。</p>
      <div class="row"><span>模型</span><select id="model"></select></div>
      <div class="row" id="angles"><span>角度</span></div>
      <div class="row" id="clips" style="display: none"><span>動作</span></div>
      <div class="row">
        <span>顯示</span>
        <button id="face" type="button">臉部特寫</button>
        <button id="cap" type="button">隱藏帽子</button>
        <button id="spin" type="button">自動旋轉</button>
        <button id="lit" type="button">場景打光</button>
        <button id="wire" type="button">線框</button>
        <button id="bg" type="button">深色背景</button>
      </div>
    </div>
    <div class="info">
      <div>檔案：<b id="i-file">—</b></div>
      <div>三角面數：<b id="i-tris">—</b>　貼圖：<b id="i-tex">—</b>　高度：<b id="i-h">—</b></div>
      <div>骨架：<b id="i-rig">—</b>　動作：<b id="i-anim">—</b>　物件：<b id="i-parts">—</b></div>
      <div id="err"></div>
    </div>
    <script type="module" src="/src/viewer.js"></script>
  </body>
</html>
