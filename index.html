<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>島嶼職棒</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,700;1,800;1,900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
</head>
  <body>
    <canvas id="scene"></canvas>
    <div class="hud" id="hud">
      <div class="scrim-top"></div>
      <div class="scrim-bottom"></div>
      <div class="brand"><i></i>ISLAND <span>LEAGUE</span></div>
      <div class="tag" id="game-tag"></div>
      <div id="intro"></div>
      <div id="tags"></div>
      <div id="live"></div>
      <div id="dip"></div>
      <div id="flash"><span>PLAY BALL</span></div>
      <button id="mute-toggle" type="button" title="靜音／開聲音（M 鍵）"><kbd>M</kbd><span>聲音開</span></button>
    </div>
    <div id="dev-export">
      <p>已複製到剪貼簿。把這段貼給 Claude 並說「鎖定」，數值就會寫回原始碼。</p>
      <textarea readonly></textarea>
      <button type="button">關閉</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
